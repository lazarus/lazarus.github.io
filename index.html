<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Austin — Software Developer</title>
	<meta name="description" content="Austin — Software Developer">
	<meta name="color-scheme" content="light dark" />
	<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
	<meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)">

	<style>
		/* ---------- Theme ---------- */
		:root {
			--bg: #0b0f14;
			--text: #e6edf3;
			--muted: #a7b3c2;
			--accent-rgb: 122, 162, 247;
			/* #7aa2f7 */
			--accent2-rgb: 199, 120, 255;
			/* #c778ff */
			--surface: #101725;
			--radius: 14px;
			--shadow: 0 10px 26px rgba(0, 0, 0, .25);
		}

		@media (prefers-color-scheme: light) {
			:root {
				--bg: #f6f8fa;
				--text: #0b1220;
				--muted: #4b5565;
				--surface: #ffffff;
				--shadow: 0 10px 24px rgba(2, 6, 23, .10);
			}
		}

		/* ---------- Layout ---------- */
		* {
			box-sizing: border-box;
		}

		html,
		body {
			height: 100%;
		}

		body {
			margin: 0;
			color: var(--text);
			background: var(--bg);
			font: 16px/1.55 system-ui, -apple-system, Segoe UI, Roboto, Arial, Noto Sans, "Apple Color Emoji", "Segoe UI Emoji";
			display: grid;
			place-items: center;
			overflow-x: hidden;
		}

		main {
			text-align: center;
			padding: clamp(24px, 6vw, 72px);
			position: relative;
			z-index: 1;
		}

		/* ---------- Minimal "aurora" background ---------- */
		.bg {
			position: fixed;
			inset: 0;
			z-index: 0;
			pointer-events: none;
			overflow: hidden;
		}

		.bg::before,
		.bg::after {
			content: "";
			position: absolute;
			inset: -30vmax;
			filter: blur(60px) saturate(1.1);
			opacity: .75;
			will-change: transform;
			transform-origin: 50% 50%;
			border-radius: 50%;
		}

		.bg::before {
			background:
				radial-gradient(40vmax 40vmax at 20% 30%, rgba(var(--accent-rgb), .35), transparent 60%),
				radial-gradient(35vmax 35vmax at 80% 20%, rgba(var(--accent2-rgb), .35), transparent 60%);
			animation: driftA 26s ease-in-out infinite alternate;
		}

		.bg::after {
			background:
				radial-gradient(50vmax 45vmax at 30% 70%, rgba(var(--accent2-rgb), .28), transparent 65%),
				radial-gradient(35vmax 40vmax at 75% 65%, rgba(var(--accent-rgb), .22), transparent 60%);
			animation: driftB 32s ease-in-out infinite alternate;
		}

		@keyframes driftA {
			to {
				transform: translate3d(2%, -3%, 0) rotate(6deg)
			}
		}

		@keyframes driftB {
			to {
				transform: translate3d(-2%, 2%, 0) rotate(-5deg)
			}
		}

		/* ---------- Mark (</>) ---------- */
		.mark {
			display: inline-block;
			width: clamp(96px, 22vw, 140px);
			height: auto;
			filter: drop-shadow(0 10px 30px rgba(0, 0, 0, .25));
			animation: bob 6s ease-in-out infinite;
		}

		@keyframes bob {

			0%,
			100% {
				transform: translateY(0)
			}

			50% {
				transform: translateY(-8px)
			}
		}

		/* ---------- Text & link ---------- */
		h1 {
			margin: 18px 0 6px;
			font-size: clamp(28px, 6vw, 48px);
			line-height: 1.05;
			letter-spacing: -0.02em;
			background: linear-gradient(90deg, var(--text), rgba(var(--accent-rgb), .85));
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
		}

		.subtitle {
			margin: 0 0 20px;
			color: var(--muted);
			font-size: clamp(16px, 2.8vw, 18px);
		}

		.btn {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			padding: 10px 14px;
			border-radius: 999px;
			background: var(--surface);
			color: var(--text);
			text-decoration: none;
			border: 1px solid rgba(255, 255, 255, .08);
			box-shadow: var(--shadow);
			transition: transform .15s ease, opacity .2s ease;
		}

		.btn:hover {
			transform: translateY(-1px);
		}

		.icon {
			width: 18px;
			height: 18px;
			display: inline-block;
		}

		footer {
			position: fixed;
			inset-inline: 0;
			bottom: 0;
			z-index: 1;
			display: grid;
			place-items: center;
			padding: 14px;
			font-size: 13px;
			color: var(--muted);
			pointer-events: none;
		}

		footer span,
		footer a {
			pointer-events: auto;
		}

		/* ---------- Accessibility ---------- */
		.skip-link {
			position: absolute;
			left: -9999px;
			top: auto;
			width: 1px;
			height: 1px;
			overflow: hidden;
		}

		.skip-link:focus {
			position: fixed;
			left: 16px;
			top: 12px;
			width: auto;
			height: auto;
			background: var(--surface);
			color: var(--text);
			padding: 10px 14px;
			border-radius: 10px;
			z-index: 9999;
			border: 1px solid rgba(255, 255, 255, .12);
			box-shadow: var(--shadow);
		}

		/* ---------- Respect reduced motion ---------- */
		@media (prefers-reduced-motion: reduce) {

			.bg::before,
			.bg::after,
			.mark {
				animation: none;
			}
		}
	</style>
</head>

<body>
	<a href="#main" class="skip-link">Skip to content</a>
	<div class="bg" aria-hidden="true"></div>

	<main id="main" role="main" aria-label="Intro">
		<!-- Minimal animated mark -->
		<svg class="mark" viewBox="0 0 120 120" aria-hidden="true">
			<rect x="6" y="6" width="108" height="108" rx="16" fill="rgba(255,255,255,.04)"
				stroke="rgba(255,255,255,.10)" />
			<text x="50%" y="58%" text-anchor="middle" dy=".1em"
				font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="54"
				fill="currentColor">&lt;/&gt;</text>
		</svg>

		<h1>Austin</h1>
		<p class="subtitle">Software Developer</p>

		<p>
			<a class="btn" href="https://github.com/lazarus" target="_blank" rel="me noopener noreferrer"
				aria-label="GitHub profile">
				<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
					<path fill="currentColor"
						d="M12 2C6.48 2 2 6.7 2 12.44c0 4.6 2.87 8.5 6.85 9.88.5.1.68-.23.68-.5v-1.9c-2.78.62-3.37-1.38-3.37-1.38-.45-1.2-1.1-1.53-1.1-1.53-.9-.64.07-.63.07-.63 1 .08 1.53 1.08 1.53 1.08.9 1.6 2.38 1.14 2.96.88.1-.67.36-1.14.66-1.4-2.22-.26-4.56-1.16-4.56-5.18 0-1.15.39-2.08 1.04-2.82-.1-.26-.45-1.32.1-2.75 0 0 .84-.28 2.75 1.07a9.1 9.1 0 0 1 5 0c1.9-1.35 2.75-1.07 2.75-1.07.55 1.43.2 2.5.1 2.75.65.74 1.04 1.67 1.04 2.82 0 4.03-2.34 4.91-4.58 5.17.37.34.7 1 .7 2.03v3c0 .27.18.6.69.5A10.4 10.4 0 0 0 22 12.43C22 6.7 17.52 2 12 2Z" />
				</svg>
				<span>@lazarus</span>
			</a>
		</p>
	</main>

	<footer aria-label="Site footer">
		<span></span>
	</footer>
</body>

</html>
